<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050c">
<title>VOIDBORNE — Survive the Swarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VOIDBORNE — styles
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;overflow:hidden;background:#04050c;
  font-family:'Rajdhani',system-ui,-apple-system,sans-serif;
  color:#dff3ff;user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;touch-action:none;
}
canvas{display:block;position:fixed;inset:0;z-index:1;}

/* ---------- scanlines ---------- */
#scan{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  opacity:.45;mix-blend-mode:multiply;
}
#grain{
  position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.035;
  background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1px);
  background-size:3px 3px;animation:grain 0.6s steps(2) infinite;
}
@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(1px,-1px)}}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;z-index:10;pointer-events:none;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;opacity:0;transition:opacity .4s ease;pointer-events:none;}
#hud.on{opacity:1;}

.hud-tl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 16px);}
.score-lbl{font-size:11px;letter-spacing:.35em;color:#5d8ba8;font-weight:700;font-family:'Orbitron',sans-serif;}
.score-val{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(26px,5vw,40px);
  line-height:1;color:#eafcff;text-shadow:0 0 14px rgba(77,226,255,.75),0 0 40px rgba(77,226,255,.35);
  font-variant-numeric:tabular-nums;
}
.best-val{font-size:11px;letter-spacing:.2em;color:#4a6d84;font-weight:700;margin-top:3px;font-family:'Orbitron',sans-serif;}
.best-val span{color:#7fd8ff;}

.health{display:flex;gap:5px;margin-top:10px;}
.pip{
  width:22px;height:7px;border-radius:2px;
  background:linear-gradient(180deg,#7dfcff,#25b6ff);
  box-shadow:0 0 10px rgba(70,220,255,.9),inset 0 0 4px rgba(255,255,255,.6);
  transition:all .22s ease;
}
.pip.off{background:rgba(90,130,160,.16);box-shadow:none;}

.hud-tc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);text-align:center;}
.wave-lbl{font-size:10px;letter-spacing:.4em;color:#5d8ba8;font-weight:700;font-family:'Orbitron',sans-serif;}
.wave-val{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(20px,3.6vw,28px);color:#ffd34d;
  text-shadow:0 0 16px rgba(255,211,77,.7);line-height:1.05;font-variant-numeric:tabular-nums;}

.hud-tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 16px);
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.combo{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(15px,2.6vw,22px);
  color:#ff8ad4;text-shadow:0 0 14px rgba(255,90,190,.85);opacity:0;transition:opacity .2s,transform .12s;
  font-variant-numeric:tabular-nums;
}
.combo.on{opacity:1;}
.combo.pop{transform:scale(1.25);}

/* overdrive */
.hud-bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);
  width:min(46vw,340px);}
.od-lbl{font-size:9px;letter-spacing:.4em;color:#6a5a9a;font-weight:700;text-align:center;margin-bottom:5px;
  font-family:'Orbitron',sans-serif;transition:color .3s;}
.od-bar{height:8px;border-radius:5px;background:rgba(120,90,200,.14);overflow:hidden;
  border:1px solid rgba(160,120,255,.28);box-shadow:0 0 16px rgba(140,90,255,.18) inset;}
.od-fill{height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,#7a4dff,#c77dff,#ff9de2);
  box-shadow:0 0 14px rgba(190,120,255,.95);transition:width .12s linear;}
.od-wrap.ready .od-lbl{color:#e0b3ff;animation:pulseTxt 1s infinite;}
.od-wrap.ready .od-bar{border-color:rgba(220,160,255,.85);box-shadow:0 0 22px rgba(190,120,255,.7);}
.od-wrap.active .od-fill{background:linear-gradient(90deg,#ff9de2,#ffffff,#ff9de2);}
@keyframes pulseTxt{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- buttons ---------- */
.icon-btn{
  pointer-events:auto;width:42px;height:42px;border-radius:12px;
  background:rgba(20,34,54,.55);border:1px solid rgba(90,190,255,.3);
  color:#8fd8ff;font-size:14px;cursor:pointer;backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;
  transition:all .18s ease;
}
.icon-btn:hover{background:rgba(40,90,140,.6);border-color:#5ad4ff;box-shadow:0 0 18px rgba(70,200,255,.45);}
.icon-btn:active{transform:scale(.92);}

/* ---------- touch controls ---------- */
#touchUI{position:absolute;inset:0;opacity:0;transition:opacity .35s;pointer-events:none;}
#touchUI.on{opacity:1;}
.tbtn{
  position:absolute;pointer-events:auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.06em;
  backdrop-filter:blur(8px);cursor:pointer;transition:transform .1s,box-shadow .2s,opacity .2s;
}
.tbtn:active{transform:scale(.9);}
#dashBtn{
  right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
  width:76px;height:76px;font-size:12px;
  background:radial-gradient(circle at 35% 30%,rgba(90,230,255,.32),rgba(10,40,70,.55));
  border:1.5px solid rgba(90,230,255,.65);color:#bdf3ff;
  box-shadow:0 0 24px rgba(70,210,255,.35),inset 0 0 20px rgba(70,210,255,.15);
}
#odBtn{
  right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  width:92px;height:92px;font-size:10px;text-align:center;line-height:1.2;
  background:radial-gradient(circle at 35% 30%,rgba(190,120,255,.3),rgba(40,10,70,.55));
  border:1.5px solid rgba(190,120,255,.5);color:#dcc0ff;
  box-shadow:0 0 24px rgba(160,90,255,.25);
}
#odBtn.ready{border-color:#e6c2ff;box-shadow:0 0 34px rgba(200,130,255,.85),inset 0 0 22px rgba(200,130,255,.3);
  animation:odPulse 1.1s infinite;}
#odBtn.active{background:radial-gradient(circle at 35% 30%,rgba(255,220,255,.5),rgba(120,40,160,.6));
  border-color:#fff;box-shadow:0 0 42px rgba(255,180,255,.95);}
@keyframes odPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- panels ---------- */
.panel{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(ellipse at center,rgba(6,10,24,.55) 0%,rgba(3,4,12,.94) 75%);
  backdrop-filter:blur(3px);
}
.panel.on{display:flex;opacity:1;pointer-events:auto;}

.title{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(38px,10vw,96px);letter-spacing:.14em;line-height:1;
  background:linear-gradient(180deg,#ffffff 0%,#7fe8ff 42%,#2b8cff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(70,200,255,.6)) drop-shadow(0 0 60px rgba(70,200,255,.25));
  animation:titleIn .9s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes titleIn{from{opacity:0;transform:translateY(-26px) scale(.94);letter-spacing:.4em}
  to{opacity:1;transform:none;letter-spacing:.14em}}
.subtitle{
  font-family:'Orbitron',sans-serif;font-weight:500;letter-spacing:.55em;
  font-size:clamp(9px,1.7vw,13px);color:#5fa8cf;margin-top:14px;text-indent:.55em;
  animation:fadeUp .9s .2s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.divider{width:min(340px,72vw);height:1px;margin:26px 0;
  background:linear-gradient(90deg,transparent,rgba(90,200,255,.6),transparent);
  animation:fadeUp .9s .3s both;}

.btn{
  pointer-events:auto;font-family:'Orbitron',sans-serif;font-weight:700;
  letter-spacing:.24em;font-size:clamp(12px,2.2vw,15px);
  padding:15px 42px;border-radius:12px;cursor:pointer;
  background:linear-gradient(180deg,rgba(30,90,140,.35),rgba(10,26,48,.6));
  border:1.5px solid rgba(90,220,255,.55);color:#c9f4ff;
  box-shadow:0 0 22px rgba(60,190,255,.22),inset 0 0 22px rgba(60,190,255,.08);
  transition:all .2s ease;text-indent:.24em;
  animation:fadeUp .9s .35s both;
}
.btn:hover{
  background:linear-gradient(180deg,rgba(60,180,255,.35),rgba(20,60,110,.6));
  border-color:#8ae9ff;color:#fff;box-shadow:0 0 40px rgba(90,220,255,.65),inset 0 0 30px rgba(90,220,255,.2);
  transform:translateY(-2px);
}
.btn:active{transform:translateY(0) scale(.97);}
.btn.ghost{
  background:transparent;border-color:rgba(120,150,180,.35);color:#7fa4bd;
  box-shadow:none;padding:12px 30px;font-size:11px;
}
.btn.ghost:hover{border-color:rgba(160,200,230,.7);color:#cfe9ff;box-shadow:0 0 22px rgba(120,180,230,.25);transform:none;}

.btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px;}

/* controls help */
.help{margin-top:22px;display:grid;grid-template-columns:auto auto;gap:8px 22px;
  font-size:13px;color:#7ba0bb;animation:fadeUp .9s .5s both;max-width:520px;}
.help b{color:#b9e6ff;font-weight:600;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.1em;}
.help .k{
  display:inline-block;padding:1px 8px;border-radius:5px;font-family:'Orbitron',sans-serif;font-size:10px;
  background:rgba(70,150,210,.16);border:1px solid rgba(90,180,240,.3);color:#a8dcff;
}

/* game over stats */
.stats{display:flex;gap:clamp(24px,7vw,70px);margin:26px 0 30px;animation:fadeUp .7s .15s both;}
.stat{text-align:center;}
.stat .k{font-size:10px;letter-spacing:.3em;color:#5d8ba8;font-family:'Orbitron',sans-serif;font-weight:700;}
.stat .v{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(24px,5.5vw,42px);color:#eafcff;
  text-shadow:0 0 20px rgba(90,210,255,.6);font-variant-numeric:tabular-nums;line-height:1.15;}
.stat.gold .v{color:#ffd34d;text-shadow:0 0 22px rgba(255,200,60,.7);}
.stat.pink .v{color:#ff8ad4;text-shadow:0 0 22px rgba(255,90,190,.7);}

.panel-title{
  font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.2em;
  font-size:clamp(22px,5vw,42px);color:#ff5c7a;
  text-shadow:0 0 26px rgba(255,60,110,.75),0 0 60px rgba(255,60,110,.35);
  animation:titleIn .7s both;
}

/* ---------- wave banner ---------- */
#banner{
  position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;opacity:0;z-index:9;
}
#banner.show{animation:bannerAnim 2s cubic-bezier(.2,.8,.25,1) both;}
.banner-main{
  font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.3em;
  font-size:clamp(28px,7vw,62px);color:#fff;text-indent:.3em;
  text-shadow:0 0 30px rgba(90,220,255,.9),0 0 80px rgba(90,220,255,.5);
}
.banner-sub{
  font-family:'Orbitron',sans-serif;font-weight:500;letter-spacing:.5em;
  font-size:clamp(9px,1.8vw,13px);color:#7fd8ff;margin-top:10px;text-indent:.5em;
}
@keyframes bannerAnim{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7);filter:blur(12px);}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0);}
  72%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.14);filter:blur(6px);}
}

/* ---------- damage flash ---------- */
#dmgFlash{
  position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(255,30,70,.55) 100%);
  transition:opacity .12s ease;
}
#dmgFlash.hit{opacity:1;transition:none;}

.hidden{display:none !important;}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="grain"></div>
<div id="scan"></div>
<div id="dmgFlash"></div>

<div id="overlay">

  <!-- ================= HUD ================= -->
  <div id="hud">
    <div class="hud-tl">
      <div class="score-lbl">SCORE</div>
      <div class="score-val" id="scoreVal">0</div>
      <div class="best-val">BEST <span id="bestVal">0</span></div>
      <div class="health" id="health"></div>
    </div>

    <div class="hud-tc">
      <div class="wave-lbl">WAVE</div>
      <div class="wave-val" id="waveVal">1</div>
    </div>

    <div class="hud-tr">
      <button class="icon-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
      <div class="combo" id="combo">×1.0</div>
    </div>

    <div class="hud-bottom">
      <div class="od-wrap" id="odWrap">
        <div class="od-lbl" id="odLbl">OVERDRIVE</div>
        <div class="od-bar"><div class="od-fill" id="odFill"></div></div>
      </div>
    </div>
  </div>

  <!-- ================= TOUCH ================= -->
  <div id="touchUI">
    <button class="tbtn" id="dashBtn">DASH</button>
    <button class="tbtn" id="odBtn">OVER<br>DRIVE</button>
  </div>

  <!-- ================= BANNER ================= -->
  <div id="banner"></div>

  <!-- ================= MENU ================= -->
  <div class="panel on" id="menu">
    <div class="title">VOIDBORNE</div>
    <div class="subtitle">SURVIVE THE SWARM</div>
    <div class="divider"></div>
    <button class="btn" id="playBtn">INITIALIZE</button>
    <div class="help">
      <b>MOVE</b><span><span class="k">W A S D</span> / <span class="k">← ↑ ↓ →</span> &nbsp;·&nbsp; left stick</span>
      <b>AIM</b><span>mouse &nbsp;·&nbsp; right stick &nbsp;·&nbsp; auto-lock</span>
      <b>DASH</b><span><span class="k">SPACE</span> &nbsp;·&nbsp; DASH button</span>
      <b>OVERDRIVE</b><span><span class="k">E</span> &nbsp;·&nbsp; OVERDRIVE button</span>
      <b>PAUSE</b><span><span class="k">ESC</span> &nbsp;·&nbsp; <span class="k">P</span></span>
    </div>
  </div>

  <!-- ================= PAUSE ================= -->
  <div class="panel" id="pauseEl">
    <div class="panel-title" style="color:#7fe8ff;text-shadow:0 0 26px rgba(90,220,255,.75)">PAUSED</div>
    <div class="divider"></div>
    <div class="btn-row">
      <button class="btn" id="resumeBtn">RESUME</button>
      <button class="btn ghost" id="restartBtn">RESTART</button>
      <button class="btn ghost" id="quitBtn">MAIN MENU</button>
    </div>
    <div class="help" style="margin-top:34px">
      <b>SOUND</b><span><span class="k">M</span> &nbsp;·&nbsp; toggle audio</span>
    </div>
  </div>

  <!-- ================= GAME OVER ================= -->
  <div class="panel" id="over">
    <div class="panel-title">SYSTEM FAILURE</div>
    <div class="stats">
      <div class="stat"><div class="k">SCORE</div><div class="v" id="finalScore">0</div></div>
      <div class="stat gold"><div class="k">WAVE</div><div class="v" id="finalWave">1</div></div>
      <div class="stat pink"><div class="k">BEST</div><div class="v" id="finalBest">0</div></div>
    </div>
    <div class="btn-row">
      <button class="btn" id="againBtn">RE-INITIALIZE</button>
      <button class="btn ghost" id="menuBtn">MAIN MENU</button>
    </div>
    <div id="newBest" class="subtitle hidden" style="color:#ffd34d;margin-top:22px;animation:none">NEW RECORD</div>
  </div>

</div>

<script>
"use strict";
/* ============================================================
   VOIDBORNE
   A neon arena survival shooter — vanilla canvas 2D
   ============================================================ */

/* ---------------- UTILITIES ---------------- */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const rand  = (a,b)=> a+Math.random()*(b-a);
const randInt=(a,b)=> Math.floor(a+Math.random()*(b-a+1));
const d2 = (x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;return dx*dx+dy*dy;};
const hyp = Math.hypot;

function angleLerp(a,b,t){
  let d = ((b-a+Math.PI)%TAU+TAU)%TAU - Math.PI;
  return a + d*t;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const _rgb = {};
function hexRgb(hex){
  if(_rgb[hex]) return _rgb[hex];
  let h = hex.replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const n = parseInt(h,16);
  const o = {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
  _rgb[hex] = o; return o;
}
function rgba(hex,a){const c=hexRgb(hex);return 'rgba('+c.r+','+c.g+','+c.b+','+a+')';}

/* ---------------- CANVAS ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false});

let W=0, H=0, DPR=1, S=1;

/* ---------------- GLOW SPRITE CACHE ---------------- */
const glowCache = new Map();
function getGlow(hex){
  let g = glowCache.get(hex);
  if(g) return g;
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const cx = c.getContext('2d');
  const r = size/2;
  const col = hexRgb(hex);
  const grd = cx.createRadialGradient(r,r,0,r,r,r);
  grd.addColorStop(0.00, 'rgba('+col.r+','+col.g+','+col.b+',1)');
  grd.addColorStop(0.14, 'rgba('+col.r+','+col.g+','+col.b+',0.72)');
  grd.addColorStop(0.36, 'rgba('+col.r+','+col.g+','+col.b+',0.24)');
  grd.addColorStop(0.65, 'rgba('+col.r+','+col.g+','+col.b+',0.055)');
  grd.addColorStop(1.00, 'rgba('+col.r+','+col.g+','+col.b+',0)');
  cx.fillStyle = grd;
  cx.fillRect(0,0,size,size);
  glowCache.set(hex,c);
  return c;
}
function drawGlow(x,y,rad,hex,alpha){
  const s = getGlow(hex);
  ctx.globalAlpha = alpha;
  ctx.drawImage(s, x-rad, y-rad, rad*2, rad*2);
  ctx.globalAlpha = 1;
}

/* ---------------- AUDIO ---------------- */
const Sfx = {
  ctx:null, master:null, noiseBuf:null, enabled:true, ready:false,

  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.34;
      this.master.connect(this.ctx.destination);

      const len = this.ctx.sampleRate * 1.2;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;

      this.ready = true;
    }catch(e){ /* audio unavailable */ }
  },
  resume(){
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type, vol, slideTo){
    if(!this.enabled || !this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.03);
  },
  noise(dur, vol, f0, f1){
    if(!this.enabled || !this.ready) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const flt = this.ctx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(f0, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(flt); flt.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+dur+0.02);
  },

  shoot(){ this.tone(rand(760,880), 0.055, 'square', 0.055, 320); },
  ehit(){ this.noise(0.06, 0.12, 4200, 900); },
  boom(big){
    this.noise(big?0.5:0.24, big?0.4:0.24, big?1800:2800, 90);
    if(big) this.tone(90, 0.4, 'sawtooth', 0.16, 32);
  },
  pickup(){ this.tone(660, 0.09, 'sine', 0.11, 1320); },
  hurt(){ this.tone(240, 0.32, 'sawtooth', 0.22, 60); this.noise(0.28,0.2,1400,120); },
  dash(){ this.noise(0.18, 0.14, 3200, 400); this.tone(420,0.12,'sine',0.07,900); },
  wave(){ this.tone(330,0.16,'triangle',0.11); setTimeout(()=>this.tone(494,0.2,'triangle',0.11),90); },
  od(){ this.tone(160,0.7,'sawtooth',0.16,900); this.tone(320,0.7,'sine',0.09,1800); },
  clear(){ this.tone(523,0.14,'triangle',0.11); setTimeout(()=>this.tone(659,0.14,'triangle',0.11),95);
           setTimeout(()=>this.tone(784,0.3,'triangle',0.12),190); }
};

/* ---------------- BACKGROUND ---------------- */
let stars=[], nebulas=[], bgGrad=null, vignette=null;

function buildBg(){
  bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0.00, '#05060f');
  bgGrad.addColorStop(0.45, '#080b1c');
  bgGrad.addColorStop(1.00, '#03040b');

  vignette = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.22, W/2, H/2, Math.max(W,H)*0.78);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(0.62, 'rgba(0,0,0,0.34)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.92)');

  // stars
  stars = [];
  const count = clamp(Math.floor((W*H)/8200), 60, 320);
  for(let i=0;i<count;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*1.7 + 0.35,
      a: Math.random()*0.55 + 0.18,
      sp: Math.random()*0.5 + 0.08,
      ph: Math.random()*TAU,
      L: Math.random()            // parallax layer 0..1
    });
  }

  // nebulas
  const cols = ['#1b3bff','#7a1bff','#ff1b6b','#00b4ff','#5a00ff'];
  nebulas = [];
  for(let i=0;i<5;i++){

      x: Math.random()*W,

    });

}

/* ---------------- RESIZE ---------------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S = clamp(Math.min(W,H)/900, 0.70, 1.55);
  buildBg();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 120));

/* ---------------- INPUT ---------------- */
const keys = Object.create(null);
let mouseX = 0, mouseY = 0, mouseActive = false;
let usingTouch = matchMedia('(pointer: coarse)').matches;
let moveStick = null, aimStick = null;

function isTouchDevice(){ return usingTouch; }

window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();

  if(k==='escape' || k==='p'){
    if(state===State.PLAYING) pauseGame();
    else if(state===State.PAUSED) resumeGame();
  }
  if(k==='m'){ toggleSound(); }
  if(k===' ' && state===State.PLAYING) tryDash();
  if(k==='e' && state===State.PLAYING) tryOverdrive();
}, {passive:false});

window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

canvas.addEventListener('pointerdown', e=>{
  Sfx.init(); Sfx.resume();
  if(e.pointerType === 'mouse'){
    usingTouch = false;
    mouseActive = true;
    mouseX = e.clientX; mouseY = e.clientY;
    return;
  }
  usingTouch = true;
  document.getElementById('touchUI').classList.add('on');
  const st = {id:e.pointerId, ox:e.clientX, oy:e.clientY, x:e.clientX, y:e.clientY};
  if(e.clientX < W*0.5){
    if(!moveStick) moveStick = st;
  }else{
    if(!aimStick) aimStick = st;
  }
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
}, {passive:true});

canvas.addEventListener('pointermove', e=>{
  if(e.pointerType === 'mouse'){
    usingTouch = false;
    mouseActive = true;
    mouseX = e.clientX; mouseY = e.clientY;
    return;
  }
  if(moveStick && moveStick.id === e.pointerId){ moveStick.x = e.clientX; moveStick.y = e.clientY; }
  if(aimStick  && aimStick.id  === e.pointerId){ aimStick.x  = e.clientX; aimStick.y  = e.clientY; }
}, {passive:true});

function releasePointer(e){
  if(moveStick && moveStick.id === e.pointerId) moveStick = null;
  if(aimStick  && aimStick.id  === e.pointerId) aimStick  = null;
}
canvas.addEventListener('pointerup', releasePointer, {passive:true});
canvas.addEventListener('pointercancel', releasePointer, {passive:true});
canvas.addEventListener('contextmenu', e=> e.preventDefault());

/* ---------------- WAVE SYSTEM ---------------- */
function buildWave(n){
  const q = [];
  const drones   = 3 + Math.floor(n*1.35);
  const weavers  = n>=2 ? Math.floor(n*0.65) : 0;
  const snipers  = n>=3 ? Math.floor(n*0.45) : 0;
  const orbiters = n>=5 ? Math.floor(n*0.32) : 0;
  const brutes   = n>=7 ? Math.floor((n-5)*0.28) : 0;

  for(let i=0;i<drones;i++)   q.push('drone');
  for(let i=0;i<weavers;i++)  q.push('weaver');
  for(let i=0;i<snipers;i++)  q.push('sniper');
  for(let i=0;i<orbiters;i++) q.push('orbiter');
  for(let i=0;i<brutes;i++)   q.push('brute');

  spawnQueue = shuffle(q);
}

function startWave(){
  wave++;
  buildWave(wave);
  waveActive = true;
  spawnTimer = 0;
  waveVal.textContent = wave;
  banner('WAVE ' + wave, wave === 1 ? 'SURVIVE' : (wave % 5 === 0 ? 'THREAT RISING' : ''));
  Sfx.wave();
}

/* ---------------- SPAWNING ---------------- */
const ENEMY_DEF = {
  drone  : {r:13, hp:3,  speed:122, color:'#5cff9d', sides:3, score:10,  mass:1.0},
  weaver : {r:15, hp:5,  speed:96,  color:'#ffd166', sides:4, score:16,  mass:1.1},
  sniper : {r:12, hp:4,  speed:118, color:'#c77dff', sides:4, score:22,  mass:0.9},
  orbiter: {r:14, hp:6,  speed:132, color:'#4dd2ff', sides:5, score:24,  mass:1.1},
  brute  : {r:27, hp:22, speed:52,  color:'#ff5c7a', sides:6, score:55,  mass:3.0}
};

function spawnEnemy(type){
  const def = ENEMY_DEF[type];
  const m = 70*S;
  const side = randInt(0,3);
  let x,y;
  if(side===0){ x = rand(0,W); y = -m; }
  else if(side===1){ x = W+m; y = rand(0,H); }
  else if(side===2){ x = rand(0,W); y = H+m; }
  else { x = -m; y = rand(0,H); }

  const hpMul = 1 + (wave-1)*0.155;
  const spMul = 1 + (wave-1)*0.024;

  const e = {
    type: type,
    x, y, vx:0, vy:0,
    r: def.r * S,
    hp: Math.ceil(def.hp * hpMul),
    maxHp: Math.ceil(def.hp * hpMul),
    speed: def.speed * S * spMul,
    color: def.color,
    sides: def.sides,
    score: def.score,
    mass: def.mass,
    t: rand(0,10),
    rot: rand(0,TAU),
    spin: rand(-2.2,2.2),
    fireCd: rand(0.6,2.2),
    flash: 0,
    charge: 0,
    dead: false,
    radiusExtra: 0
  };
  enemies.push(e);
}

/* ---------------- PARTICLES / FX ---------------- */
function spawnSparks(x,y,n,color,spd,lifeMin,lifeMax){
  spd = spd || 240*S;
  lifeMin = lifeMin || 0.22;
  lifeMax = lifeMax || 0.55;
  const q = qualityScale();
  n = Math.max(1, Math.round(n*q));
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU;
    const sp = rand(0.25,1)*spd;
    const life = rand(lifeMin,lifeMax);
    particles.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      life, maxLife: life,
      r: rand(1.0,2.6)*S,
      color,
      drag: 0.90,
      line: Math.random() < 0.4
    });
  }
}

function spawnShock(x,y,maxR,color,width,life){
  shocks.push({x,y,r:0,maxR,life,maxLife:life||0.5,color,width:(width||4)*S});
}

function explode(x,y,color,scale){
  scale = scale || 1;
  spawnSparks(x, y, 14*scale, color, 320*S*scale, 0.25, 0.7);
  spawnSparks(x, y, 6*scale, '#ffffff', 420*S*scale, 0.14, 0.32);
  spawnShock(x, y, 70*S*scale, color, 4*scale, 0.46);
  particles.push({
    x, y, vx:0, vy:0, life:0.16, maxLife:0.16,
    r: 26*S*scale, color:'#ffffff', drag:1, line:false, flash:true
  });
}

function addText(x,y,text,color,size){
  texts.push({x,y,text,color,size:(size||14)*S,life:0.9,maxLife:0.9,vy:-42*S});
}

function qualityScale(){
  return (W*H < 420000) ? 0.62 : 1;
}

/* ---------------- PLAYER ACTIONS ---------------- */
function tryDash(){
  if(!player.alive || player.dashCd > 0) return;
  let dx = 0, dy = 0;
  const mv = getMoveVector();
  if(Math.abs(mv.x) > 0.01 || Math.abs(mv.y) > 0.01){ dx = mv.x; dy = mv.y; }
  else { dx = Math.cos(player.angle); dy = Math.sin(player.angle); }
  const l = hyp(dx,dy) || 1;
  dx/=l; dy/=l;

  player.dashDirX = dx; player.dashDirY = dy;
  player.dashTime = CFG.dashTime;
  player.dashCd = CFG.dashCd;
  player.invuln = Math.max(player.invuln, CFG.dashTime + 0.12);
  player.vx = dx * CFG.dashSpeed * S;
  player.vy = dy * CFG.dashSpeed * S;

  spawnSparks(player.x, player.y, 12, '#7fe8ff', 300*S, 0.18, 0.42);
  spawnShock(player.x, player.y, 52*S, '#4de2ff', 3, 0.32);
  shake = Math.max(shake, 5*S);
  Sfx.dash();
}

function tryOverdrive(){
  if(!player.alive) return;
  if(overdrive) return;
  if(od < CFG.odMax) return;
  od = 0;
  overdrive = true;
  odTimer = CFG.odDuration;
  odWrap.classList.add('active');
  odBtn.classList.add('active');
  odLbl.textContent = 'OVERDRIVE ACTIVE';
  spawnShock(player.x, player.y, 340*S, '#c77dff', 8, 0.75);
  spawnShock(player.x, player.y, 220*S, '#ffffff', 4, 0.55);
  spawnSparks(player.x, player.y, 34, '#e0aaff', 460*S, 0.3, 0.9);
  shake = Math.max(shake, 16*S);
  Sfx.od();
}

function getMoveVector(){
  let x = 0, y = 0;
  if(keys['a'] || keys['arrowleft'])  x -= 1;
  if(keys['d'] || keys['arrowright']) x += 1;
  if(keys['w'] || keys['arrowup'])    y -= 1;
  if(keys['s'] || keys['arrowdown'])  y += 1;

  if(moveStick){
    const dx = moveStick.x - moveStick.ox;
    const dy = moveStick.y - moveStick.oy;
    const maxR = 58*S;
    const len = hyp(dx,dy);
    if(len > 6){
      const k = Math.min(len, maxR)/maxR;
      const a = Math.atan2(dy,dx);
      x = Math.cos(a)*k;
      y = Math.sin(a)*k;
    }
  }
  const l = hyp(x,y);
  if(l > 1){ x/=l; y/=l; }
  return {x, y};
}

/* ---------------- UPDATE: PLAYER ---------------- */
function updatePlayer(dt){
  if(!player.alive) return;

  const mv = getMoveVector();
  const spd = CFG.playerSpeed * S * (overdrive ? 1.16 : 1);

  if(player.dashTime > 0){
    player.dashTime -= dt;
    player.vx *= Math.pow(0.02, dt);
    player.vy *= Math.pow(0.02, dt);
    // dash trail
    if(Math.random() < 0.9){
      particles.push({
        x: player.x + rand(-4,4)*S, y: player.y + rand(-4,4)*S,
        vx: -player.vx*0.06, vy: -player.vy*0.06,
        life: 0.3, maxLife: 0.3, r: 3.4*S,
        color: overdrive ? '#e0aaff' : '#4de2ff', drag: 0.9, line:false
      });
    }
  }else{
    const k = 1 - Math.exp(-13*dt);
    player.vx += (mv.x*spd - player.vx)*k;
    player.vy += (mv.y*spd - player.vy)*k;
  }

  player.x += player.vx*dt;
  player.y += player.vy*dt;

  // bounds
  const pad = player.r + 4*S;
  if(player.x < pad){ player.x = pad; player.vx = Math.abs(player.vx)*0.25; }
  if(player.x > W-pad){ player.x = W-pad; player.vx = -Math.abs(player.vx)*0.25; }
  if(player.y < pad){ player.y = pad; player.vy = Math.abs(player.vy)*0.25; }
  if(player.y > H-pad){ player.y = H-pad; player.vy = -Math.abs(player.vy)*0.25; }

  // ---- aiming ----
  let aim = player.angle;
  let hasManualAim = false;

  if(usingTouch){
    if(aimStick){
      const dx = aimStick.x - aimStick.ox;
      const dy = aimStick.y - aimStick.oy;
      if(hyp(dx,dy) > 10*S){
        aim = Math.atan2(dy,dx);
        hasManualAim = true;
      }
    }
    if(!hasManualAim){
      const e = nearestEnemy();
      if(e) aim = Math.atan2(e.y - player.y, e.x - player.x);
      else if(Math.abs(mv.x) > 0.05 || Math.abs(mv.y) > 0.05) aim = Math.atan2(mv.y, mv.x);
    }
  }else{
    aim = Math.atan2(mouseY - player.y, mouseX - player.x);
  }

  player.angle = angleLerp(player.angle, aim, 1 - Math.exp(-24*dt));

  // ---- firing ----
  player.fireCd -= dt;
  if(player.fireCd <= 0){
    fireBullet();
    player.fireCd = CFG.fireRate * (overdrive ? 0.42 : 1);
  }

  // ---- cooldowns ----
  if(player.dashCd > 0) player.dashCd -= dt;
  if(player.invuln > 0) player.invuln -= dt;

  // ---- thruster particles ----
  const speedMag = hyp(player.vx, player.vy);
  if(speedMag > 60*S && Math.random() < 0.75){
    const a = Math.atan2(player.vy, player.vx) + Math.PI + rand(-0.35,0.35);
    particles.push({
      x: player.x + Math.cos(a)*player.r*0.8,
      y: player.y + Math.sin(a)*player.r*0.8,
      vx: Math.cos(a)*rand(40,130)*S,
      vy: Math.sin(a)*rand(40,130)*S,
      life: rand(0.18,0.36), maxLife: 0.36,
      r: rand(1.2,2.6)*S,
      color: overdrive ? '#d9a3ff' : '#5fd8ff',
      drag: 0.9, line:false
    });
  }
}

function nearestEnemy(){
  let bestE = null, bd = Infinity;
  for(let i=0;i<enemies.length;i++){
    const e = enemies[i];
    if(e.dead) continue;
    const d = d2(player.x, player.y, e.x, e.y);
    if(d < bd){ bd = d; bestE = e; }
  }
  return bestE;
}

function fireBullet(){
  const spread = 0.022;
  const a = player.angle + rand(-spread, spread);
  const bx = player.x + Math.cos(a)*player.r*1.45;
  const by = player.y + Math.sin(a)*player.r*1.45;
  const sp = CFG.bulletSpeed * S;

  bullets.push({
    x: bx, y: by,
    vx: Math.cos(a)*sp,
    vy: Math.sin(a)*sp,
    r: 3.6*S,
    life: 1.15,
    dmg: CFG.bulletDmg,
    color: overdrive ? '#e6b3ff' : '#9df9ff'
  });

  // recoil
  player.vx -= Math.cos(a)*24*S;
  player.vy -= Math.sin(a)*24*S;

  // muzzle
  for(let i=0;i<2;i++){
    particles.push({
      x: bx, y: by,
      vx: Math.cos(a)*rand(60,180)*S + rand(-40,40)*S,
      vy: Math.sin(a)*rand(60,180)*S + rand(-40,40)*S,
      life: 0.13, maxLife: 0.13,
      r: rand(1,2.2)*S,
      color: '#ffffff', drag: 0.85, line:false
    });
  }
  Sfx.shoot();
}

/* ---------------- UPDATE: BULLETS ---------------- */
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.life -= dt;

    if(b.life <= 0 || b.x < -60 || b.x > W+60 || b.y < -60 || b.y > H+60){
      bullets.splice(i,1); continue;
    }

    let hit = false;
    for(let j=0;j<enemies.length;j++){
      const e = enemies[j];
      if(e.dead) continue;
      const rr = e.r + b.r;
      if(d2(b.x, b.y, e.x, e.y) < rr*rr){
        damageEnemy(e, b.dmg, b.vx, b.vy);
        spawnSparks(b.x, b.y, 3, b.color, 180*S, 0.12, 0.28);
        hit = true;
        break;
      }
    }
    if(hit) bullets.splice(i,1);
  }
}

/* ---------------- UPDATE: ENEMIES ---------------- */
function updateEnemies(edt){
  const sepStrength = 0.55;

  for(let i=0;i<enemies.length;i++){
    const e = enemies[i];
    if(e.dead) continue;

    e.t += edt;
    e.rot += e.spin*edt;
    if(e.flash > 0) e.flash -= edt*4;
    if(e.charge > 0) e.charge -= edt;

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = hyp(dx,dy) || 1;
    const ang = Math.atan2(dy,dx);

    let tx = player.x, ty = player.y, rate = 2.4;

    switch(e.type){
      case 'drone':
        rate = 2.6;
        break;

      case 'weaver': {
        const perp = ang + Math.PI/2;
        const off = Math.sin(e.t*2.4) * 130 * S;
        tx = player.x + Math.cos(perp)*off;
        ty = player.y + Math.sin(perp)*off;
        rate = 2.2;
        // shoot
        e.fireCd -= edt;
        if(e.fireCd <= 0 && dist < 620*S){
          e.fireCd = rand(1.9, 2.8);
          fireEnemyBullet(e, ang, 250*S, '#ffd166', 5.2*S);
        }
        break;
      }

      case 'sniper': {
        const want = 340*S;
        if(dist < want*0.85){ tx = player.x - dx/dist*200; ty = player.y - dy/dist*200; }
        else if(dist > want*1.15){ tx = player.x; ty = player.y; }
        else { tx = e.x + Math.cos(ang+Math.PI/2)*40; ty = e.y + Math.sin(ang+Math.PI/2)*40; }
        rate = 3.0;

        e.fireCd -= edt;
        if(e.fireCd < 0.55 && e.fireCd > 0) e.charge = 1;
        if(e.fireCd <= 0 && dist < 780*S){
          e.fireCd = rand(1.7, 2.4);
          e.charge = 0;
          fireEnemyBullet(e, ang, 620*S, '#c77dff', 4.4*S);
          spawnSparks(e.x, e.y, 6, '#c77dff', 200*S, 0.12, 0.3);
        }
        break;
      }

      case 'orbiter': {
        const orbR = 195*S;
        const oa = e.t*1.15;
        tx = player.x + Math.cos(oa)*orbR;
        ty = player.y + Math.sin(oa)*orbR;
        rate = 3.2;

        e.fireCd -= edt;
        if(e.fireCd <= 0 && dist < 520*S){
          e.fireCd = rand(1.3, 2.0);
          fireEnemyBullet(e, ang - 0.18, 330*S, '#4dd2ff', 4.6*S);
          fireEnemyBullet(e, ang + 0.18, 330*S, '#4dd2ff', 4.6*S);
        }
        break;
      }

      case 'brute':
        rate = 1.25;
        break;
    }

    // steering
    const ta = Math.atan2(ty - e.y, tx - e.x);
    const dvx = Math.cos(ta)*e.speed;
    const dvy = Math.sin(ta)*e.speed;
    const k = 1 - Math.exp(-rate*edt);
    e.vx += (dvx - e.vx)*k;
    e.vy += (dvy - e.vy)*k;

    e.x += e.vx*edt;
    e.y += e.vy*edt;

    // ---- contact with player ----
    if(player.alive){
      const rr = e.r + player.r;
      if(d2(e.x,e.y,player.x,player.y) < rr*rr){
        if(player.invuln <= 0 && player.dashTime <= 0){
          damagePlayer(e.type === 'brute' ? 2 : 1);
          const push = 340*S;
          player.vx -= Math.cos(ang)*push;
          player.vy -= Math.sin(ang)*push;
          e.vx += Math.cos(ang)*push*0.5;
          e.vy += Math.sin(ang)*push*0.5;
        }
        // soft separation
        const d = hyp(dx,dy) || 1;
        const overlap = rr - d;
        if(overlap > 0){
          e.x -= (dx/d)*overlap*0.5;
          e.y -= (dy/d)*overlap*0.5;
        }
      }
    }
  }

  // ---- separation between enemies ----
  for(let i=0;i<enemies.length;i++){
    const a = enemies[i];
    if(a.dead) continue;
    for(let j=i+1;j<enemies.length;j++){
      const b = enemies[j];
      if(b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const rr = (a.r + b.r) * 0.92;
      const dd = dx*dx + dy*dy;
      if(dd < rr*rr && dd > 0.01){
        const d = Math.sqrt(dd);
        const push = (rr - d)/d * sepStrength;
        const px = dx*push*0.5, py = dy*push*0.5;
        a.x -= px; a.y -= py;
        b.x += px; b.y += py;
      }
    }
  }

  // ---- remove dead ----
  for(let i=enemies.length-1;i>=0;i--){
    if(enemies[i].dead) enemies.splice(i,1);
  }
}

function fireEnemyBullet(e, ang, speed, color, radius){
  ebullets.push({
    x: e.x + Math.cos(ang)*e.r*0.9,
    y: e.y + Math.sin(ang)*e.r*0.9,
    vx: Math.cos(ang)*speed,
    vy: Math.sin(ang)*speed,
    r: radius,
    life: 4.5,
    color: color
  });
  Sfx.tone(rand(180,240), 0.09, 'sawtooth', 0.045, 90);
}

/* ---------------- UPDATE: ENEMY BULLETS ---------------- */
function updateEnemyBullets(dt){
  for(let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i];
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.life -= dt;

    if(b.life <= 0 || b.x < -80 || b.x > W+80 || b.y < -80 || b.y > H+80){
      ebullets.splice(i,1); continue;
    }
    if(player.alive && player.invuln <= 0 && player.dashTime <= 0){
      const rr = b.r + player.r*0.82;
      if(d2(b.x,b.y,player.x,player.y) < rr*rr){
        damagePlayer(1);
        spawnSparks(b.x,b.y,7,b.color,220*S,0.14,0.34);
        ebullets.splice(i,1);
      }
    }
  }
}

/* ---------------- DAMAGE ---------------- */
function damageEnemy(e, dmg, kx, ky){
  e.hp -= dmg;
  e.flash = 1;

  const m = e.mass || 1;
  const kl = hyp(kx||0, ky||0) || 1;
  e.vx += (kx/kl) * 90 * S / m;
  e.vy += (ky/kl) * 90 * S / m;

  if(e.hp <= 0 && !e.dead){
    e.dead = true;
    killEnemy(e);
  }else{
    Sfx.ehit();
  }
}

function killEnemy(e){
  const big = (e.type === 'brute');

  explode(e.x, e.y, e.color, big ? 2.0 : 1.0);
  shake = Math.max(shake, big ? 13*S : 4.5*S);
  if(big) hitStop = Math.max(hitStop, 0.055);

  // combo
  combo++;
  comboTimer = CFG.comboWindow;
  comboPop = 1;

  const mult = Math.min(1 + combo*0.09, 10);
  const gained = Math.round(e.score * mult);
  score += gained;
  scoreVal.textContent = score.toLocaleString('en-US');

  comboEl.classList.add('on');
  comboEl.textContent = '×' + mult.toFixed(1);
  comboEl.classList.remove('pop');
  void comboEl.offsetWidth;
  comboEl.classList.add('pop');

  addText(e.x, e.y - e.r, '+'+gained, big ? '#ffd34d' : '#c9f4ff', big ? 20 : 14);

  // brute splits
  if(big){
    for(let i=0;i<3;i++){
      const a = Math.random()*TAU;
      const child = {
        type:'drone',
        x: e.x + Math.cos(a)*e.r*0.7,
        y: e.y + Math.sin(a)*e.r*0.7,
        vx: Math.cos(a)*260*S,
        vy: Math.sin(a)*260*S,
        r: ENEMY_DEF.drone.r*S*0.9,
        hp: Math.ceil(ENEMY_DEF.drone.hp * (1 + (wave-1)*0.155) * 0.8),
        maxHp: 3,
        speed: ENEMY_DEF.drone.speed*S*1.25,
        color: ENEMY_DEF.drone.color,
        sides: 3,
        score: 8,
        mass: 0.9,
        t: rand(0,10), rot: rand(0,TAU), spin: rand(-3,3),
        fireCd: rand(1,3), flash:0, charge:0, dead:false
      };
      child.maxHp = child.hp;
      enemies.push(child);
    }
    Sfx.boom(true);
  }else{
    Sfx.boom(false);
  }

  // drops
  const orbCount = big ? 4 : (Math.random() < 0.42 ? 1 : 0);
  for(let i=0;i<orbCount;i++){
    pickups.push({
      x: e.x + rand(-10,10)*S,
      y: e.y + rand(-10,10)*S,
      vx: rand(-70,70)*S,
      vy: rand(-70,70)*S,
      type: 'energy',
      r: 6*S,
      life: 12,
      t: rand(0,6)
    });
  }
  if(player.hp < CFG.maxHp && Math.random() < (big ? 0.5 : 0.035)){
    pickups.push({
      x: e.x, y: e.y, vx: 0, vy: 0,
      type: 'health', r: 8*S, life: 14, t: 0
    });
  }
}

function damagePlayer(amount){
  if(player.invuln > 0 || !player.alive) return;

  player.hp -= amount;
  player.invuln = CFG.invulnTime;
  combo = 0;
  comboEl.classList.remove('on');

  shake = Math.max(shake, 20*S);
  hitStop = Math.max(hitStop, 0.06);

  dmgFlash.classList.add('hit');
  setTimeout(()=> dmgFlash.classList.remove('hit'), 60);

  spawnSparks(player.x, player.y, 20, '#ff4d6d', 340*S, 0.2, 0.5);
  spawnShock(player.x, player.y, 110*S, '#ff4d6d', 5, 0.45);

  syncHealth();
  Sfx.hurt();

  if(player.hp <= 0){
    player.hp = 0;
    player.alive = false;
    syncHealth();
    gameOver();
  }
}

/* ---------------- UPDATE: PICKUPS ---------------- */
function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const p = pickups[i];
    p.t += dt;
    p.life -= dt;

    // magnet
    if(player.alive){
      const dx = player.x - p.x, dy = player.y - p.y;
      const d = hyp(dx,dy) || 1;
      const magnetR = 170*S;
      if(d < magnetR){
        const pull = (1 - d/magnetR) * 1500 * S;
        p.vx += (dx/d) * pull * dt;
        p.vy += (dy/d) * pull * dt;
      }
    }

    p.vx *= Math.pow(0.06, dt);
    p.vy *= Math.pow(0.06, dt);
    p.x += p.vx*dt;
    p.y += p.vy*dt;

    if(p.life <= 0){ pickups.splice(i,1); continue; }

    if(player.alive){
      const rr = p.r + player.r*1.3;
      if(d2(p.x,p.y,player.x,player.y) < rr*rr){
        if(p.type === 'energy'){
          od = Math.min(CFG.odMax, od + CFG.odGain);
          spawnSparks(p.x, p.y, 5, '#ffd34d', 160*S, 0.12, 0.3);
          Sfx.pickup();
        }else{
          player.hp = Math.min(CFG.maxHp, player.hp + 1);
          syncHealth();
          spawnSparks(p.x, p.y, 12, '#5cff9d', 220*S, 0.16, 0.42);
          spawnShock(p.x, p.y, 70*S, '#5cff9d', 3, 0.4);
          addText(p.x, p.y-14*S, '+1 HP', '#5cff9d', 15);
          Sfx.tone(520,0.14,'sine',0.13,1040);
        }
        pickups.splice(i,1);
      }
    }
  }
}

/* ---------------- UPDATE: PARTICLES / SHOCKS / TEXTS ---------------- */
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    const dr = Math.pow(p.drag, dt*60);
    p.vx *= dr;
    p.vy *= dr;
  }
  for(let i=shocks.length-1;i>=0;i--){
    const s = shocks[i];
    s.life -= dt;
    if(s.life <= 0) shocks.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){
    const t = texts[i];
    t.life -= dt;
    t.y += t.vy*dt;
    t.vy *= Math.pow(0.94, dt*60);
    if(t.life <= 0) texts.splice(i,1);
  }
}

/* ---------------- MAIN UPDATE ---------------- */
function update(dt){
  time += dt;

  // background drift
  for(const n of nebulas){
    n.x += n.vx*dt;
    n.y += n.vy*dt;
    if(n.x < -n.r) n.x = W + n.r;
    if(n.x > W + n.r) n.x = -n.r;
    if(n.y < -n.r) n.y = H + n.r;
    if(n.y > H + n.r) n.y = -n.r;
  }

  shake *= Math.pow(0.0016, dt);
  if(shake < 0.15) shake = 0;

  if(state === State.MENU){
    updateParticles(dt);
    return;
  }

  if(state === State.PAUSED){
    return;
  }

  if(state === State.GAMEOVER){
    updateParticles(dt);
    return;
  }

  // ---------- PLAYING ----------
  let gdt = dt;
  if(hitStop > 0){
    hitStop -= dt;
    gdt = dt * 0.08;
  }

  gameTime += dt;

  updatePlayer(gdt);
  updateBullets(gdt);

  const enemyScale = overdrive ? 0.34 : 1;
  const edt = gdt * enemyScale;

  updateEnemies(edt);
  updateEnemyBullets(edt);
  updatePickups(gdt);
  updateParticles(gdt);

  // combo decay
  if(comboTimer > 0){
    comboTimer -= dt;
    if(comboTimer <= 0 && combo > 0){
      combo = 0;
      comboEl.classList.remove('on');
    }
  }

  // overdrive
  if(overdrive){
    odTimer -= dt;
    if(odTimer <= 0){
      overdrive = false;
      odWrap.classList.remove('active');
      odBtn.classList.remove('active');
      odLbl.textContent = 'OVERDRIVE';
    }
  }

  // wave logic
  if(waveActive){
    if(spawnQueue.length){
      spawnTimer -= dt;
      const maxAlive = Math.min(10 + wave*2, 42);
      if(spawnTimer <= 0 && enemies.length < maxAlive){
        spawnEnemy(spawnQueue.pop());
        spawnTimer = rand(0.16, 0.42);
      }
    }else if(enemies.length === 0){
      waveActive = false;
      intermission = 2.2;
      const bonus = wave * 50;
      score += bonus;
      scoreVal.textContent = score.toLocaleString('en-US');
      banner('WAVE CLEARED', '+' + bonus + ' BONUS');
      Sfx.clear();
    }
  }else{
    if(intermission > 0){
      intermission -= dt;
      if(intermission <= 0) startWave();
    }
  }

  // overdrive HUD
  const odPct = overdrive ? (odTimer/CFG.odDuration)*100 : (od/CFG.odMax)*100;
  odFill.style.width = odPct.toFixed(1) + '%';
  const ready = !overdrive && od >= CFG.odMax;
  odWrap.classList.toggle('ready', ready);
  odBtn.classList.toggle('ready', ready);
  if(ready && !overdrive) odLbl.textContent = 'OVERDRIVE READY — PRESS E';

  // combo pop decay
  if(comboPop > 0){ comboPop -= dt*4; if(comboPop <= 0) comboEl.classList.remove('pop'); }
}

/* ============================================================
   RENDERING
   ============================================================ */

function drawBackground(){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  // nebula
  ctx.globalCompositeOperation = 'lighter';
  for(const n of nebulas){
    drawGlow(n.x, n.y, n.r, n.color, n.a);
  }

  // grid
  const gs = 84*S;
  const gAlpha = overdrive ? 0.055 : 0.022;
  ctx.strokeStyle = 'rgba(90,180,255,'+gAlpha+')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const offX = (time*6) % gs;
  const offY = (time*3) % gs;
  for(let x = -offX; x < W+gs; x += gs){
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for(let y = -offY; y < H+gs; y += gs){
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  // stars with parallax
  const px = player ? (player.x - W/2) : 0;
  const py = player ? (player.y - H/2) : 0;

  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<stars.length;i++){
    const s = stars[i];
    const tw = 0.55 + 0.45*Math.sin(time*s.sp*2.4 + s.ph);
    const ox = px * s.L * 0.028;
    const oy = py * s.L * 0.028;
    const sz = s.r * (1 + s.L*0.7);
    ctx.fillStyle = 'rgba(178,220,255,' + (s.a*tw).toFixed(3) + ')';
    ctx.fillRect(s.x - ox, s.y - oy, sz, sz);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawPlayer(){
  if(!player.alive) return;
  const r = player.r;
  const col = overdrive ? '#d9a3ff' : '#4de2ff';

  ctx.globalCompositeOperation = 'lighter';
  drawGlow(player.x, player.y, r*5.2, col, 0.42 + (overdrive ? 0.2 : 0));
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  // ship body
  ctx.beginPath();
  ctx.moveTo(r*1.65, 0);
  ctx.lineTo(-r*0.95, r*1.0);
  ctx.lineTo(-r*0.42, 0);
  ctx.lineTo(-r*0.95, -r*1.0);
  ctx.closePath();

  const g = ctx.createLinearGradient(-r, 0, r*1.65, 0);
  g.addColorStop(0, overdrive ? '#4a1f7a' : '#0a3a52');
  g.addColorStop(0.55, overdrive ? '#c77dff' : '#4de2ff');
  g.addColorStop(1, '#ffffff');
  ctx.fillStyle = g;
  ctx.fill();

  ctx.lineWidth = 1.8*S;
  ctx.strokeStyle = overdrive ? '#f0d4ff' : '#c8f6ff';
  ctx.shadowColor = col;
  ctx.shadowBlur = 16*S;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // cockpit
  ctx.beginPath();
  ctx.arc(r*0.35, 0, r*0.3, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fill();
  ctx.restore();

  // shield ring when invulnerable
  if(player.invuln > 0){
    const a = 0.28 + 0.24*Math.sin(time*22);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(160,240,255,' + a.toFixed(3) + ')';
    ctx.lineWidth = 2.2*S;
    ctx.setLineDash([7*S, 7*S]);
    ctx.lineDashOffset = -time*70;
    ctx.beginPath();
    ctx.arc(player.x, player.y, r*2.0, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'source-over';
  }

  // dash cooldown arc
  if(player.dashCd > 0){
    const p = 1 - player.dashCd/CFG.dashCd;
    ctx.strokeStyle = 'rgba(120,220,255,0.28)';
    ctx.lineWidth = 2*S;
    ctx.beginPath();
    ctx.arc(player.x, player.y, r*2.5, -Math.PI/2, -Math.PI/2 + TAU*p);
    ctx.stroke();
  }
}

function drawEnemies(){
  for(let i=0;i<enemies.length;i++){
    const e = enemies[i];
    const flash = Math.max(0, e.flash);
    const col = e.color;

    // charge telegraph for sniper
    if(e.charge > 0){
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(e.x, e.y, e.r*7, '#ffffff', 0.22);
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.globalCompositeOperation = 'lighter';
    drawGlow(e.x, e.y, e.r*3.6, col, 0.34 + flash*0.4);
    ctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.rot);

    const r = e.r;
    const n = e.sides;

    ctx.beginPath();
    for(let k=0;k<n;k++){
      const a = (k/n)*TAU;
      const px = Math.cos(a)*r, py = Math.sin(a)*r;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();

    ctx.fillStyle = flash > 0.05 ? 'rgba(255,255,255,'+(0.55+flash*0.45)+')' : rgba(col, 0.20);
    ctx.fill();

    ctx.lineWidth = 2.2*S;
    ctx.strokeStyle = flash > 0.05 ? '#ffffff' : col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 14*S;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // inner core
    ctx.beginPath();
    const ir = r*0.38;
    for(let k=0;k<n;k++){
      const a = (k/n)*TAU + Math.PI/n;
      const px = Math.cos(a)*ir, py = Math.sin(a)*ir;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = flash > 0.05 ? '#ffffff' : rgba(col, 0.85);
    ctx.fill();

    ctx.restore();

    // health bar for tough enemies
    if(e.maxHp > 6 && e.hp < e.maxHp){
      const w = e.r*2.1;
      const h = 3.2*S;
      const bx = e.x - w/2;
      const by = e.y - e.r - 10*S;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(bx, by, w, h);
      ctx.fillStyle = col;
      ctx.fillRect(bx, by, w * (e.hp/e.maxHp), h);
    }
  }
}

function drawBullets(){
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  for(let i=0;i<bullets.length;i++){
    const b = bullets[i];
    const tx = b.x - b.vx*0.020;
    const ty = b.y - b.vy*0.020;

    ctx.strokeStyle = rgba(b.color, 0.6);
    ctx.lineWidth = b.r*1.3;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    drawGlow(b.x, b.y, b.r*5.5, b.color, 0.55);
  }

  for(let i=0;i<ebullets.length;i++){
    const b = ebullets[i];
    const tx = b.x - b.vx*0.020;
    const ty = b.y - b.vy*0.020;

    ctx.strokeStyle = rgba(b.color, 0.65);
    ctx.lineWidth = b.r*1.25;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    drawGlow(b.x, b.y, b.r*5.5, b.color, 0.6);
  }

  ctx.globalCompositeOperation = 'source-over';
}

function drawPickups(){
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<pickups.length;i++){
    const p = pickups[i];
    const pulse = 1 + 0.22*Math.sin(time*7 + p.t*3);
    const col = p.type === 'energy' ? '#ffd34d' : '#5cff9d';
    const fade = p.life < 2.5 ? (0.35 + 0.65*Math.abs(Math.sin(p.life*8))) : 1;

    drawGlow(p.x, p.y, p.r*5.2*pulse, col, 0.6*fade);

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*pulse, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.85*fade) + ')';
    ctx.fill();

    ctx.strokeStyle = rgba(col, 0.6*fade);
    ctx.lineWidth = 1.6*S;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*2.1*pulse, 0, TAU);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<particles.length;i++){
    const p = particles[i];
    const t = p.life / p.maxLife;
    const a = clamp(t, 0, 1);

    if(p.flash){
      drawGlow(p.x, p.y, p.r*(1.6 - t*0.6), p.color, a*0.85);
      continue;
    }

    if(p.line){
      const lx = p.x - p.vx*0.02;
      const ly = p.y - p.vy*0.02;
      ctx.strokeStyle = rgba(p.color, a*0.9);
      ctx.lineWidth = p.r*0.9;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }else{
      ctx.fillStyle = rgba(p.color, a*0.9);
      const sz = p.r*(0.4 + t*1.1);
      ctx.beginPath();
      ctx.arc(p.x, p.y, sz, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawShocks(){
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<shocks.length;i++){
    const s = shocks[i];
    const t = 1 - s.life/s.maxLife;
    const r = s.maxR * (1 - Math.pow(1-t, 3));
    const a = (1-t);
    ctx.strokeStyle = rgba(s.color, a*0.75);
    ctx.lineWidth = Math.max(0.6, s.width*a);
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, TAU);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts(){
  ctx.textAlign = 'center';
  for(let i=0;i<texts.length;i++){
    const t = texts[i];
    const a = clamp(t.life/t.maxLife, 0, 1);
    ctx.font = '900 ' + t.size.toFixed(1) + 'px Orbitron, sans-serif';
    ctx.fillStyle = rgba(t.color, a*0.9);
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 12;
    ctx.fillText(t.text, t.x, t.y);
    ctx.shadowBlur = 0;
  }
  ctx.textAlign = 'left';
}

function drawSticks(){
  if(!moveStick && !aimStick) return;
  const maxR = 58*S;

  const drawOne = (st, color) => {
    if(!st) return;
    const dx = st.x - st.ox;
    const dy = st.y - st.oy;
    const len = hyp(dx,dy);
    const ang = Math.atan2(dy,dx);
    const cl = Math.min(len, maxR);
    const kx = st.ox + Math.cos(ang)*cl;
    const ky = st.oy + Math.sin(ang)*cl;

    ctx.globalCompositeOperation = 'lighter';
    drawGlow(st.ox, st.oy, maxR*1.9, color, 0.13);
    ctx.globalCompositeOperation = 'source-over';

    ctx.strokeStyle = rgba(color, 0.3);
    ctx.lineWidth = 2*S;
    ctx.beginPath();
    ctx.arc(st.ox, st.oy, maxR, 0, TAU);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(kx, ky, 22*S, 0, TAU);
    ctx.fillStyle = rgba(color, 0.34);
    ctx.fill();
    ctx.strokeStyle = rgba(color, 0.9);
    ctx.lineWidth = 2*S;
    ctx.stroke();
  };

  drawOne(moveStick, '#4de2ff');
  drawOne(aimStick, overdrive ? '#e0aaff' : '#ff9de2');
}

function drawOverdriveOverlay(){
  if(!overdrive) return;
  const a = 0.055 + 0.028*Math.sin(time*13);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(150,70,255,' + a.toFixed(4) + ')';
  ctx.fillRect(0,0,W,H);

  // radial pulse
  const pr = (time*420) % (Math.max(W,H)*0.8);
  ctx.strokeStyle = 'rgba(200,140,255,' + (0.08 * (1 - pr/(Math.max(W,H)*0.8))).toFixed(4) + ')';
  ctx.lineWidth = 40*S;
  ctx.beginPath();
  ctx.arc(player.x, player.y, pr, 0, TAU);
  ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';
}

function drawVignette(){
  ctx.fillStyle = vignette;
  ctx.fillRect(0,0,W,H);
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  drawBackground();

  // screen shake
  let sx = 0, sy = 0;
  if(shake > 0.2){
    sx = (Math.random()-0.5)*shake*2;
    sy = (Math.random()-0.5)*shake*2;
  }

  ctx.save();
  ctx.translate(sx, sy);

  if(state !== State.MENU){
    drawPickups();
    drawShocks();
    drawBullets();
    drawEnemies();
    drawPlayer();
    drawParticles();
    drawTexts();
  }else{
    drawParticles();
  }

  ctx.restore();

  if(state === State.PLAYING || state === State.PAUSED){
    drawSticks();
  }

  drawOverdriveOverlay();
  drawVignette();
}

/* ============================================================
   GAME FLOW
   ============================================================ */

function setState(s){
  state = s;
  hudEl.classList.toggle('on', s === State.PLAYING || s === State.PAUSED);
  menuEl.classList.toggle('on', s === State.MENU);
  pauseEl.classList.toggle('on', s === State.PAUSED);
  overEl.classList.toggle('on', s === State.GAMEOVER);

  const showTouch = (s === State.PLAYING) && usingTouch;
  touchUI.classList.toggle('on', showTouch);
  touchUI.classList.toggle('hidden', false);
}

function startGame(){
  Sfx.init(); Sfx.resume();
  resetGame();
  setState(State.PLAYING);
  startWave();
}

function pauseGame(){
  if(state !== State.PLAYING) return;
  setState(State.PAUSED);
}

function resumeGame(){
  if(state !== State.PAUSED) return;
  setState(State.PLAYING);
}

function quitToMenu(){
  setState(State.MENU);
  player = null;
  enemies = []; bullets = []; ebullets = []; pickups = []; shocks = []; texts = [];
}

function gameOver(){
  const isNew = score > best;
  if(isNew){
    best = score;
    try{ localStorage.setItem('voidborne_best', String(best)); }catch(e){}
    bestVal.textContent = best;
  }

  $('finalScore').textContent = score.toLocaleString('en-US');
  $('finalWave').textContent = wave;
  $('finalBest').textContent = best.toLocaleString('en-US');
  $('newBest').classList.toggle('hidden', !isNew);

  setTimeout(()=>{
    setState(State.GAMEOVER);
    Sfx.tone(300,0.5,'sawtooth',0.15,70);
    Sfx.noise(0.7, 0.28, 1600, 60);
  }, 480);
}

function toggleSound(){
  Sfx.enabled = !Sfx.enabled;
  if(Sfx.enabled && Sfx.master) Sfx.master.gain.value = 0.34;
  if(!Sfx.enabled && Sfx.master) Sfx.master.gain.value = 0;
}

/* ============================================================
   UI WIRING
   ============================================================ */
$('playBtn').addEventListener('click', ()=>{ Sfx.init(); startGame(); });
$('againBtn').addEventListener('click', startGame);
$('menuBtn').addEventListener('click', quitToMenu);
$('pauseBtn').addEventListener('click', pauseGame);
$('resumeBtn').addEventListener('click', resumeGame);
$('restartBtn').addEventListener('click', startGame);
$('quitBtn').addEventListener('click', quitToMenu);

dashBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); if(state===State.PLAYING) tryDash(); });
odBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); if(state===State.PLAYING) tryOverdrive(); });

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && state === State.PLAYING) pauseGame();
});

/* ============================================================
   BOOT
   ============================================================ */
resize();
resetGame();
setState(State.MENU);

if(usingTouch) touchUI.classList.add('on');

let lastT = performance.now();
function frame(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);
  render();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
